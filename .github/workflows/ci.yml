name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev tools
        run: pip install pytest ruff
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Build demo inventory database
        run: python scripts/build_inventory_db.py
      - name: Tests
        run: pytest
